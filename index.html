<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Digital Clock</h2>
    <center>
    <div class="clock">
        <div>
            <span id="hours">00</span>:
        </div>
        <div>
            <span id="min">00</span>:
        </div>
        <div>
            <span id="sec">00</span>
        </div>
        <div>
            <span id="ampm">AM</span>
        </div>
    </div></center>
    <script src="script.js"></script>

</body>
</html>
